# Every hour: check for employer replies, send due applications and follow-ups.
# Free on GitHub. Needs the AUTOMATION_SECRET repository secret (same value as in Vercel).
name: Apply tick

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Call the tick route
        env:
          AUTOMATION_SECRET: ${{ secrets.AUTOMATION_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 300 \
            -X POST -H "Authorization: Bearer $AUTOMATION_SECRET" \
            https://sales-crm-virid-ten.vercel.app/api/jobs/tick
